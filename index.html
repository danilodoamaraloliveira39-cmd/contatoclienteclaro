
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CLARO | Central de Atendimento</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #e30613;
      padding: 30px 20px;
      text-align: center;
      color: #fff;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .logo span {
      display: block;
      font-size: 15px;
      letter-spacing: 5px;
      margin-top: 4px;
    }

    main {
      max-width: 850px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 22px 16px;
      background: #fff;
      border-radius: 14px;
      text-decoration: none;
      color: #222;
      border: 1px solid #e5e5e5;
      box-shadow: 0 4px 12px #00000008;
      transition: 0.25s;
    }

    .item:hover {
      transform: translateY(-4px);
      border-color: #e30613;
      box-shadow: 0 8px 20px #e3061320;
    }

    .icone {
      width: 54px;
      height: 54px;
      min-width: 54px;
      border-radius: 12px;
      background: #e30613;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .icone svg {
      width: 29px;
      height: 29px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .texto {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.4;
    }

    /* BOTÃO FLUTUANTE DO WHATSAPP */

    .whatsapp-flutuante {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 62px;
      height: 62px;
      background: #25D366;
      color: #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      box-shadow: 0 4px 15px #00000030;
      z-index: 9999;
      transition: transform 0.25s, box-shadow 0.25s;
      animation: pulsar 2s infinite;
    }

    .whatsapp-flutuante:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px #00000040;
    }

    .whatsapp-flutuante svg {
      width: 36px;
      height: 36px;
      fill: #fff;
    }

    .whatsapp-tooltip {
      position: absolute;
      right: 74px;
      background: #fff;
      color: #222;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 3px 12px #00000015;
    }

    @keyframes pulsar {
      0% {
        box-shadow: 0 0 0 0 #25D36670;
      }

      70% {
        box-shadow: 0 0 0 12px #25D36600;
      }

      100% {
        box-shadow: 0 0 0 0 #25D36600;
      }
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      color: #777;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      main {
        margin: 25px auto;
        padding: 0 14px;
      }

      .menu {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .item {
        padding: 17px;
      }

      .logo {
        font-size: 36px;
      }

      .whatsapp-flutuante {
        width: 58px;
        height: 58px;
        right: 16px;
        bottom: 16px;
      }

      .whatsapp-flutuante svg {
        width: 33px;
        height: 33px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .whatsapp-flutuante {
        animation: none;
      }

      .item,
      .whatsapp-flutuante {
        transition: none;
      }
    }
  </style>
</head>
